# The situation of E-002 built with the menu: Ana has an X in P1 and P2 and a sub in P3, no other cell.
# A long press on the X of P3 offers the three options and «Cancelar»; «Entró de cambio» makes the circle.
# The legend, found by scrolling in the strip, explains the light red cell, «!» and «≠» and not the player
# in red. P3 shows «≠» and not «!»; P1 and P5 show «!»; P6 shows nothing.
- tapOn: "Ana, P1: casilla vacía"
- assertVisible: "Ana, P1: X, titular"
- tapOn: "Ana, P2: casilla vacía"
- assertVisible: "Ana, P2: X, titular"
- tapOn: "Ana, P3: casilla vacía"
- assertVisible: "Ana, P3: X, titular"
- longPressOn: "Ana, P3: X, titular"
- assertVisible: "Entró de cambio"
- assertVisible: "Titular"
- assertVisible: "Quitar"
- assertVisible: "Cancelar"
- tapOn: "Entró de cambio"
- assertNotVisible: "Entró de cambio"
- assertVisible: "Ana, P3: X con círculo, entró de cambio"
- scrollUntilVisible:
    element:
      text: "Si la marcas, no descansará el mínimo del tramo."
- assertVisible: "Si la marcas, no descansará el mínimo del tramo."
- scrollUntilVisible:
    element:
      text: "Periodo incompleto: tiene menos de 5 titulares."
- assertVisible: "Periodo incompleto: tiene menos de 5 titulares."
- scrollUntilVisible:
    element:
      text: "Periodo incoherente: hay un cambio pero menos de 5 titulares. ¿Has quitado la X de quien salió?"
- assertVisible: "Periodo incoherente: hay un cambio pero menos de 5 titulares. ¿Has quitado la X de quien salió?"
- assertNotVisible: "No cumple la regla del tramo."
- assertNotVisible: "Con las casillas vacías que quedan en el tramo ya no se puede cumplir la regla para todos."
- assertVisible:
    text: "≠"
    rightOf: "P3"
    leftOf: "P4"
- assertVisible:
    text: "!"
    leftOf: "P2"
- assertVisible:
    text: "!"
    rightOf: "P5"
    leftOf: "P6"
- assertNotVisible:
    text: "!"
    rightOf: "P6"

