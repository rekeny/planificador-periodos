appId: com.fernando.planificadorperiodos
name: "RF-045 RF-046 RF-047 RF-048 RF-050 RF-051 RF-052 RF-053 RF-054 RF-055 RF-066 RF-087 E-011 E-012 E-013 E-027: the question of a sixth X, the choice of the replaced X, the reminder and the long-press menu, each closing three ways, and the legend of a period with a sub"
---
# Journey of US5 on a clean install (T066). Written WITHOUT running it: Maestro is not run in the session that
# writes it, so the first real run may need adjustments. Nothing here uses the network.
# Device size assumed: a phone in portrait, iOS and Android. The only platform-conditional steps are Back
# (Android only) and, in its place on iOS, a second tap outside. Only the first seven rows are touched, so no
# vertical scroll of the grid is needed. The team has 10 players, so the call-up is in range and the strip holds
# only what the situation of each step makes appear.
# A dialog closes three ways, and each is tried: its «Cancelar», a tap outside the card (the point 2%,50% is
# the dark backdrop left of it, at mid height: 5%,5% falls in the iOS status bar, which never reaches the app) and Back on Android; iOS has no Back, so there the third way is a second tap
# outside. After each, the cells are checked as they were.
# In a rule-window period (P1 to P5) with 5 X a tap on an empty cell asks; in P6, a free period, it does not.
# The long press is Maestro's `longPressOn` on the cell's accessible label.
- launchApp:
    clearState: true
- tapOn: "Nuevo equipo"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Alevín A"
- tapOn: "Nombre"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
