# Constitution 4: every change was saved at once. The app is closed and opened again with nothing
# cleared; the list of teams comes first (F-A3: a link in the first fraction of a second is lost) and
# then match 1 is opened with its deep link.
- stopApp
- launchApp
- assertVisible: "Nuevo equipo"
- assertVisible: "Alevín A"
- openLink: planificadorperiodos://matches/1
# iOS asks «¿Abrir en Planificador de periodos?» before following a link from outside the app; the
# simulator's language decides the button. Android opens it straight away.
- runFlow:
    when:
      visible: "Abrir|Open"
    commands:
      - tapOn: "Abrir|Open"
# The match is read from the database after the link: on a busy machine the grid takes longer than
# the default wait of a check, so the first check waits up to 20 seconds.
- extendedWaitUntil:
    visible: "Ana, P3: X, titular"
    timeout: 20000
- assertVisible: "Ana, P3: X, titular"
- assertVisible: "Carla, P3: X, titular"
- assertVisible: "Bea, P3: casilla vacía"
- assertVisible: "Gala, P2: X, titular"
- assertVisible: "Fran, P2: X, titular"
- assertVisible: "Eva, P2: casilla vacía"
- assertVisible: "Dani, P2: casilla vacía"
