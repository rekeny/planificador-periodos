name: "RF-060 RF-062 RF-063 RF-064 RF-065 RF-067 RF-087 E-001 E-003 E-005 E-006 E-007 E-008 E-009: the rule warnings appear and disappear as the coach taps, with the legend, the general warning and the marks in the headers, and they come back after the app is closed"
---
# Journey of US4 on a clean install (T060). Written WITHOUT running it: Maestro is not installed
# here (developer decision of 2026-11-13), so the first real run will need adjustments, like the
# swipes of the US1 flows. Nothing here uses the network.
# Maestro checks TEXT only, never colours or screenshots (answer of 2026-11-12). The light red
# cells and the players in red are proven by their legend lines (RF-087); the colours themselves
# are tested in Jest (T058, T059) and checked by eye on the three devices (T057).
# E-027 (the situation of E-002, with a circled X) cannot be built in D2: it is in T066.
# Device assumption: a TABLET, where 12 player rows, the banners and the legend fit with no
# vertical scroll (T057: the iPad in landscape) and «Deshacer» sits in the header. On a phone in
# portrait the lower rows would need a vertical swipe that this flow does not do. Maestro does not
# scroll by itself before a tap, so on a phone this flow is expected to fail at the lower rows.
# The cells are buttons «Juan, P1: casilla vacía» (T054). The legend lines and the general
# warning are plain texts. A header mark is a Text «!» under the period name, in the same column,
# so each period is told apart by its position. Maestro compares the left edges: «rightOf: P5»
# keeps what starts right of where «P5» starts, so it includes the mark under «P5» itself (checked
# on an iPhone 17 simulator, 2026-11-20). The mark of a period is «!» right of its own title and
# left of the next title; «!» not right of «P6» means no mark from P6 on; «!» not left of «P5»
# means no mark on P1 to P4.
# The team has 12 players. A match that the examples want with 10 leaves Hugo and Iker out.
# Matches are created in order, so they are 1 to 6; match 1 is opened again with the deep link.
#
# PERFORMANCE (manual, for Fernando; not automated: Maestro has no timer fine enough for 100 ms).
# On the 5th-generation iPad, with a Release build, 12 players and an 8-period match: a tap on a
# cell must repaint under 100 ms. Film the iPad with a phone in slow motion at 240 fps while
# tapping 20 different cells, count the frames between the finger touching the glass and the cell
# changing (under 24 frames is under 100 ms) and write the worst of the 20 in review.md with the
# iPad model, the iOS version and the build. The steps are in the Pending of T060 in tasks.md.
- launchApp:
    clearState: true
- tapOn: "Nuevo equipo"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Alevín A"
- tapOn: "Nombre"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
