# Interruption: the app is closed and opened again with nothing cleared; the list of teams comes first (RF-073)
# and match 1 is opened with its deep link. The warnings are computed again from the saved marks: the E-003
# situation (Juan with X in P1-P4, general warning, player in red, light red P5, «!» on P1-P5).
- stopApp
- launchApp
- assertVisible: "Nuevo equipo"
- assertNotVisible: "Juan, P4: X, titular"
- openLink: planificadorperiodos://matches/1
# iOS asks «¿Abrir en Planificador de periodos?» before following a link from outside the app; the
# simulator's language decides the button. Android opens it straight away.
- runFlow:
    when:
      visible: "Abrir|Open"
    commands:
      - tapOn: "Abrir|Open"
# The match is read from the database after the link: on a busy machine the grid takes longer than
# the default wait of a check, so the first check waits up to 20 seconds.
- extendedWaitUntil:
    visible: "Juan, P4: X, titular"
    timeout: 20000
- assertVisible: "Juan, P4: X, titular"
- assertVisible: "Juan, P5: casilla vacía"
