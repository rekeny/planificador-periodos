appId: com.fernando.planificadorperiodos
name: "RF-011 RF-013 RF-014 RF-016 RF-017 RF-069 RF-073 E-022: two teams and their players, with the order, the field limits, the messages and the duplicate-number warning"
---
# Journey of US1 on a clean install. Nothing here uses the network. The airplane-mode check of
# RF-011 is T079: Maestro cannot switch the network off.
- launchApp:
    clearState: true
- assertVisible: "Todavía no hay equipos. Crea el primero."

# First team: «Cadete B», created first on purpose, so the list must sort it after «Alevín A».
- tapOn: "Nuevo equipo"
- assertVisible: "6 periodos"
- assertVisible: "8 periodos"
# E-022: a 41st character is not accepted and no message appears. Jest cannot prove it, because
# changeText does not apply maxLength.
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "abcdefghijabcdefghijabcdefghijabcdefghijk"
- assertVisible: "abcdefghijabcdefghijabcdefghijabcdefghij"
- runFlow: subflows/commit-typed-text.yaml
- assertNotVisible: "abcdefghijabcdefghijabcdefghijabcdefghijk"
- assertNotVisible: "Escribe un nombre."
- eraseText
- tapOn:
    text: "Categoría"
    below: "Categoría"
- inputText: "klmnopqrstklmnopqrstklmnopqrstklmnopqrstu"
- assertVisible: "klmnopqrstklmnopqrstklmnopqrstklmnopqrst"
- runFlow: subflows/commit-typed-text.yaml
- assertNotVisible: "klmnopqrstklmnopqrstklmnopqrstklmnopqrstu"
- assertNotVisible: "Escribe un nombre."
- eraseText
# A blank name cannot be saved.
- tapOn: "Categoría"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible: "Escribe un nombre."
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Cadete B"
- tapOn: "Nombre"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "8 periodos"
- tapOn: "Guardar"
- assertVisible: "Cadete B"

# Second team, with a category and the default format (6 periods).
- tapOn: "Nuevo equipo"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Alevín A"
- tapOn:
    text: "Categoría"
    below: "Categoría"
- inputText: "2015"
- tapOn: "Categoría"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
# On iOS the row is one accessibility element read as «Alevín A, 2015»; on Android name and category
# are two texts. The wildcards match both.
- assertVisible: "Alevín A.*"
- assertVisible: ".*2015"
# RF-073 RF-014: both teams are listed, «Alevín A» first.
- assertVisible:
    text: "Cadete B"
    below: "Alevín A.*"
- assertNotVisible:
    text: "Alevín A.*"
    below: "Cadete B"

# Players of «Alevín A». The first form checks the limits, the number message and the blank name.
- tapOn: "Alevín A.*"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "uvwxyzabcduvwxyzabcduvwxyzabcduvwxyzabcde"
- assertVisible: "uvwxyzabcduvwxyzabcduvwxyzabcduvwxyzabcd"
- runFlow: subflows/commit-typed-text.yaml
- assertNotVisible: "uvwxyzabcduvwxyzabcduvwxyzabcduvwxyzabcde"
- assertNotVisible: "Escribe un nombre."
- eraseText
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "100"
- assertVisible: "10"
- runFlow: subflows/commit-typed-text.yaml
- assertNotVisible: "100"
- eraseText
- inputText: "07"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible: "El dorsal debe ser de 0 a 99 o 00, sin ceros a la izquierda."
- assertVisible: "Escribe un nombre."
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Eva"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- eraseText
- inputText: "9"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible: "Eva|.*, Eva.*"

# RF-016: three players added one after the other without leaving the team screen, shown 4, 7, 9.
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Bea"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "4"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible: "Bea|.*, Bea.*"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Carla"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "7"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible: "Carla|.*, Carla.*"
- assertVisible:
    text: "Carla|.*, Carla.*"
    below: "Bea|.*, Bea.*"
- assertVisible:
    text: "Eva|.*, Eva.*"
    below: "Carla|.*, Carla.*"
- assertNotVisible: "Hay jugadores con el mismo dorsal: 7."

# RF-017 RF-069: a second number 7 is saved and the warning appears. Same number: sorted by name.
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Luis"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "7"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible: "Luis|.*, Luis.*"
- assertVisible: "Hay jugadores con el mismo dorsal: 7."
- assertVisible:
    text: "Luis|.*, Luis.*"
    below: "Carla|.*, Carla.*"

# Odd numbers: "0" is listed before "00", and both before 4.
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Zoe"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "0"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible: "Zoe|.*, Zoe.*"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Ana"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "00"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible: "Ana|.*, Ana.*"
- assertVisible:
    text: "Ana|.*, Ana.*"
    below: "Zoe|.*, Zoe.*"
- assertVisible:
    text: "Bea|.*, Bea.*"
    below: "Ana|.*, Ana.*"
