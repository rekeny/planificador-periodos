appId: com.fernando.planificadorperiodos
name: "RF-010 RF-030 RF-031 RF-033 RF-035 RF-036 RF-037 RF-068 RF-082 RF-083 RF-084 E-015 E-022 E-023 E-024 E-030 E-032 E-033: a match is created with the native pickers, the call-up is chosen, edited and warned about, and the grid opens"
---
# Journey of US2 on a clean install (T048). Written WITHOUT running it: Maestro is not installed
# here (developer decision of 2026-11-13). The first real run will need the adjustments marked
# "unverified" below, like the swipe of the US1 flows. Nothing here uses the network.
# The removal of a player WITH marks (E-017) is T056: the grid cannot be marked until T055.
- launchApp:
    clearState: true
# Today's date as the app shows it (E-023), written by the flow because it changes every day.
- evalScript: ${output.today = ('0' + new Date().getDate()).slice(-2) + '/' + ('0' + (new Date().getMonth() + 1)).slice(-2) + '/' + new Date().getFullYear()}

# Two teams, both with the default format (6 periods): «Alevín A» gets 12 players, «Infantil» none.
- tapOn: "Nuevo equipo"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Alevín A"
- tapOn: "Nombre"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo equipo"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Infantil"
- tapOn: "Nombre"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Alevín A"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Ana"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "1"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Bea"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "2"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Carla"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "3"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Dani"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "4"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Eva"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "5"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Fran"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "6"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Gala"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "7"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Hugo"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "8"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Iker"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "9"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Jon"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "10"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Kira"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "11"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- tapOn: "Nuevo jugador"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Luis"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "12"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible: "Luis"

# RF-082: the form half-filled and the app closed. No match is created: D2 has no match list, so
# the deep link of the first match, which would be number 1, must show the not-found message.
- tapOn: "Nuevo partido"
- tapOn:
    text: "Local"
    below: "Local"
- inputText: "Rivales"
- assertVisible: "Rivales"
- stopApp
- launchApp
- assertVisible: "Nuevo equipo"
- assertNotVisible: "Guardar"
- openLink: planificadorperiodos://matches/1
# iOS asks «¿Abrir en Planificador de periodos?» before following a link from outside the app; the
# simulator's language decides the button. Android opens it straight away.
- runFlow:
    when:
      visible: "Abrir|Open"
    commands:
      - tapOn: "Abrir|Open"
- assertVisible: "No se ha encontrado: puede que se haya borrado."
- stopApp
- launchApp
- tapOn: "Alevín A"
- tapOn: "Nuevo partido"
# The form opened again has the defaults: nothing typed, everyone selected, today's date (E-023).
- assertNotVisible: "Rivales"
- assertVisible: ${output.today}
# The call-up count and its warning sit under «Notas», below the first screen of a phone.
- scrollUntilVisible:
    element:
      text: "12 convocados"
- assertNotVisible: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 12."
- scrollUntilVisible:
    element:
      text: "8 periodos"
    direction: UP

# MATCH 1: format 8 (E-024), the pickers (RF-083, E-032), the field limits (E-022), the messages.
- tapOn: "8 periodos"
- assertNotVisible: "Cancelar"
- assertNotVisible: "Convocatoria fuera del rango: con 8 periodos deben ser de 8 a 12 jugadores, y hay 12."
# The native pickers differ by platform, version and language. Date: go back month by month until
# March 2026 is shown, then choose day 1. Time: 18 and 30. On iOS (checked on an iPhone 17 simulator,
# iOS 27.2, 2026-11-20) the date is a compact button, «Date Picker» in English, that opens the
# calendar in a popup; a tap outside the popup closes it.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "(?i)date picker|selector de fecha"
      - repeat:
          times: 14
          while:
            notVisible: "(?i).*mar.* 2026.*"
          commands:
            - tapOn: "(?i)previous.*|anterior.*"
# On Android (checked on an Android 17 emulator, 2026-11-20) the date is the button «Fecha», which
# opens a Material calendar. Its month and day names follow the device language, so both are matched.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Fecha"
      - repeat:
          times: 14
          while:
            notVisible: "(?i).*mar.* 2026.*"
          commands:
            - tapOn: "(?i)change to previous month|cambiar al mes anterior"
      - tapOn: "(?i).*(march 1, 2026|1 de marzo de 2026).*"
      - tapOn: "Aceptar"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "1"
      - tapOn:
          point: "50%, 15%"
- assertVisible: "01/03/2026"
- scrollUntilVisible:
    element:
      text: "Hora"
# E-033: a form without a time shows «Sin hora» and «Añadir hora», and no «Quitar hora». «Añadir hora»
# gives 12:00: iOS shows it in the field at once; Android opens the dialog on 12:00 (D52), so only iOS
# asserts «12:00» here and Android closes the dialog with «Aceptar» after choosing 18:30 below, because
# «Cancelar» is never tapped in this flow.
- assertVisible: "Sin hora"
- assertVisible: "Añadir hora"
- assertNotVisible: "Quitar hora"
- tapOn: "Añadir hora"
# iOS: «Añadir hora» shows 12:00 in the field at once, and the flow stops there. The wheels that
# change the time open in a popup that Maestro cannot see, so choosing 18:30 by position landed on
# 21:45, 15:15 and 18:10 in three runs on an iPhone 17 simulator (iOS 27.2, 2026-11-20) and is not
# run. Changing the time on iOS is checked by the Jest tests of the field and by hand on the device
# (decision of Fernando, 2026-11-20). Android picks 18:30 in its dialog and closes it with «Aceptar».
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "12:00"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "(?i)18 hours?|18 horas?"
      - tapOn: "(?i)30 minutes?|30 minutos?"
      - tapOn: "Aceptar"
      - assertVisible: "18:30"
# E-032, E-033: «Quitar hora» leaves no time and keeps the date, and the field goes back to «Sin hora»
# and «Añadir hora». The match is saved without a time.
- tapOn: "Quitar hora"
- assertNotVisible: "18:30"
- assertVisible: "01/03/2026"
- assertVisible: "Sin hora"
- assertVisible: "Añadir hora"
- assertNotVisible: "Quitar hora"
# The quick option writes the team name, which is then edited. E-022: a 41st character is not
# accepted and shows no message.
- scrollUntilVisible:
    element:
      text: "Mi equipo es local"
- tapOn: "Mi equipo es local"
- assertVisible: "Alevín A"
- tapOn: "Alevín A"
- eraseText
- inputText: "mnopqrstuvmnopqrstuvmnopqrstuvmnopqrstuvw"
- assertVisible: "mnopqrstuvmnopqrstuvmnopqrstuvmnopqrstuv"
- runFlow: subflows/commit-typed-text.yaml
- assertNotVisible: "mnopqrstuvmnopqrstuvmnopqrstuvmnopqrstuvw"
- eraseText
- inputText: "Alevín A B"
- tapOn:
    text: "Visitante"
    below: "Visitante"
- inputText: "Rivales B"
# «Visitante» is a single-line field: Enter closes the keyboard. A tap on its label would tap the
# field again, because the label and the field share the text.
- pressKey: Enter
- runFlow: subflows/close-keyboard.yaml
# One score only: the message; the second score makes it go away. A fourth digit is not accepted.
# The two score fields share the label «Resultado final»: below it, index 0 is the home score and
# index 1 the away one.
- scrollUntilVisible:
    element:
      text: "Notas"
- tapOn:
    text: "Resultado final"
    below: "Resultado final"
    index: 0
- inputText: "1234"
- assertVisible: "123"
- runFlow: subflows/commit-typed-text.yaml
- assertNotVisible: "1234"
- runFlow: subflows/close-number-keyboard.yaml
- scrollUntilVisible:
    element:
      text: "Guardar"
- tapOn: "Guardar"
- assertVisible: "Escribe los dos resultados o ninguno."
# «Guardar» left the form scrolled to the bottom, so the score fields are out of view: scroll back up
# before tapping the away score. The scroll goes up to «Variante», the first label: stopping at
# «Resultado final» left it, and the field under it, behind the header of the sheet, where Maestro
# still counts them as visible and the tap and the typing were lost.
- scrollUntilVisible:
    element:
      text: "Variante"
    direction: UP
    visibilityPercentage: 100
- tapOn:
    text: "Resultado final"
    below: "Resultado final"
    index: 1
- inputText: "45"
- runFlow: subflows/close-number-keyboard.yaml
# The message sits next to «Guardar», so it is only checked there: out of view, «not visible» would
# pass without proving that the second score made it go away.
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Guardar"
- assertNotVisible: "Escribe los dos resultados o ninguno."
- scrollUntilVisible:
    element:
      text: "Notas"
    direction: UP
    visibilityPercentage: 100
- tapOn:
    text: "Notas"
    below: "Notas"
# The 501 characters are typed in three pieces: Maestro gives each command 120 s and typing took
# 0.18 to 0.6 s per character on an Android 17 emulator (2026-11-21).
- inputText: "notesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesab"
- inputText: "cdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenote"
- inputText: "sabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdenotesabcdez"
- assertVisible: ""
- assertNotVisible: ""
- runFlow: subflows/close-number-keyboard.yaml
# Everyone selected, 12 players: no warning. Guardar opens the grid. The form is still moving while the
# keyboard closes, so the flow waits before tapping.
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Guardar"
- assertVisible: "12 convocados"
- assertNotVisible: "Convocatoria fuera del rango: con 8 periodos deben ser de 8 a 12 jugadores, y hay 12."
- tapOn: "Guardar"
- assertVisible: "Convocatoria"
- assertVisible: "Ana"
- assertVisible: "Luis"
- assertNotVisible: "Guardar"
# Back from the grid goes to the team and never shows the filled form again (review P-30).
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Alevín A"
- assertVisible: "Nuevo partido"
- assertNotVisible: "Guardar"

# MATCH 2: the team's default is still 6 (E-024, RF-036, RF-037). Deselecting to 8 players warns
# and «Guardar» still works (E-015, RF-010, RF-068).
- tapOn: "Nuevo partido"
- scrollUntilVisible:
    element:
      text: "12 convocados"
- scrollUntilVisible:
    element:
      text: ".*Ana.*"
# On Android the first row can count as visible while it is still under the system navigation bar,
# where a tap does nothing, and the rows below it are off screen: one more swipe brings the four
# rows to the middle of the screen (checked on an Android 17 emulator, 2026-11-21).
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          direction: UP
- tapOn: ".*Ana.*"
- tapOn: ".*Bea.*"
- tapOn: ".*Carla.*"
- tapOn: ".*Dani.*"
- assertVisible: "8 convocados"
- assertVisible: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 8."
- scrollUntilVisible:
    element:
      text: "Guardar"
- tapOn: "Guardar"
- assertVisible: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 8."
- assertVisible: "Eva"
- assertNotVisible: "Ana"

# The call-up screen. A player created from the match joins the team and the call-up (RF-035):
# 9 players, so the warning goes away (RF-068).
- tapOn: "Convocatoria"
- assertVisible: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 8."
- scrollUntilVisible:
    element:
      text: "Crear jugador nuevo"
- tapOn: "Crear jugador nuevo"
- tapOn:
    text: "Nombre"
    below: "Nombre"
- inputText: "Nora"
- tapOn:
    text: "Dorsal"
    below: "Dorsal"
- inputText: "15"
- tapOn: "Dorsal"
- runFlow: subflows/close-keyboard.yaml
- tapOn: "Guardar"
- assertVisible:
    text: "Nora"
    above: "Añadir a la convocatoria"
- assertNotVisible: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 8."
# RF-033: a player with no marks is removed without a question and offered again below; adding
# him puts him back in the call-up. The player removed is Fran, the second row: the second
# «Quitar de la convocatoria». The first row (Eva) is not used because on iOS the strip under the
# header does not take touches and the first button sits half inside it: a tap in its middle was lost
# in four runs, and one that hit its lower part landed on the wrong row, on an iPhone 17 simulator
# (iOS 27.2, 2026-11-20). A tap right after the new player was created was also lost once, so the
# flow waits two seconds first (waiting, as optional, for a text that never appears is Maestro's
# way to pause).
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "this text is never shown"
    timeout: 2000
    optional: true
- tapOn:
    text: "Quitar de la convocatoria"
    index: 1
- assertNotVisible: "¿Quitar a Fran de la convocatoria?"
# Fran now sits in the list below, which may be under the fold of a phone.
- scrollUntilVisible:
    element:
      text: ".*Fran.*"
- assertVisible:
    text: ".*Fran.*"
    below: "Añadir a la convocatoria"
- tapOn:
    text: ".*Fran.*"
    below: "Añadir a la convocatoria"
- scrollUntilVisible:
    element:
      text: "Fran"
    direction: UP
- assertVisible:
    text: "Fran"
    above: "Añadir a la convocatoria"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 70%, 50%
- assertVisible: "Eva"
- assertVisible: "Nora"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Alevín A"

# MATCH 3: the team now has 13 players, all selected: the warning shows and the match is created
# (E-030, RF-010, RF-068).
- tapOn: "Nuevo partido"
- scrollUntilVisible:
    element:
      text: "13 convocados"
# The warning sits under the count: on Android the count can be on screen with the warning still
# below the navigation bar, so the flow scrolls to the warning itself (checked on an Android 17
# emulator, 2026-11-21).
- scrollUntilVisible:
    element:
      text: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 13."
- assertVisible: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 13."
- scrollUntilVisible:
    element:
      text: "Guardar"
- tapOn: "Guardar"
- assertVisible: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 13."
# With 13 players the last row is below the first screen of a phone: the grid scrolls vertically.
- scrollUntilVisible:
    element:
      text: "Nora"
- assertVisible: "Nora"
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Alevín A"
      - tapOn: "Equipos"

# MATCH 4: a team with no active players. The match is created with an empty call-up.
- tapOn: "Infantil"
- tapOn: "Nuevo partido"
- scrollUntilVisible:
    element:
      text: "0 convocados"
# The warning sits under the count: on Android the count can be on screen with the warning still
# below the navigation bar, so the flow scrolls to the warning itself (checked on an Android 17
# emulator, 2026-11-21).
- scrollUntilVisible:
    element:
      text: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 0."
- assertVisible: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 0."
- scrollUntilVisible:
    element:
      text: "Guardar"
- tapOn: "Guardar"
- assertVisible: "Convocatoria fuera del rango: con 6 periodos deben ser de 9 a 12 jugadores, y hay 0."
- tapOn: "Convocatoria"
- assertVisible: "No quedan jugadores activos por añadir. Puedes crear uno nuevo."
- assertVisible: "Crear jugador nuevo"
