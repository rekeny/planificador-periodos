name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of the Linux binaries, checked against the published checksums files.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      OSV_SCANNER_VERSION: "2.7.1"
      OSV_SCANNER_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
      SEMGREP_VERSION: "1.185.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history; verify.sh diffs against origin/main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install security tools
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME/.local/bin" -f gitleaks.tar.gz gitleaks
          curl -sSfL -o "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          rm gitleaks.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install "semgrep==${SEMGREP_VERSION}"

      # Mutation testing is the slow step. The incremental file keeps the result of every mutant, so a
      # run only tests the mutants whose code or tests changed. On main the run is full (force) and
      # rebuilds the file; pull requests start from the latest one saved.
      - name: Restore the mutation testing cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ hashFiles('tests/support/**', 'jest*.config.js', 'stryker.config.json', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: stryker-${{ runner.os }}-${{ hashFiles('tests/support/**', 'jest*.config.js', 'stryker.config.json', 'package-lock.json') }}-

      - run: scripts/verify.sh
        env:
          STRYKER_INCREMENTAL: "1"
          STRYKER_FORCE: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}

      - name: Save the mutation testing cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ hashFiles('tests/support/**', 'jest*.config.js', 'stryker.config.json', 'package-lock.json') }}-${{ github.sha }}
